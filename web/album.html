<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>摄影选片</title>
<style>
:root{color-scheme:light;--ink:#192c2b;--green:#17695a;--paper:#f5f4ef}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Microsoft YaHei",sans-serif}header,main{max-width:1280px;margin:auto;padding:28px}header{padding-top:45px}small{color:#56736a}h1{font-size:34px;margin:4px 0}button,a.action{font:inherit;border:1px solid #c8d2cd;border-radius:10px;padding:10px 16px;background:white;color:var(--ink);cursor:pointer;text-decoration:none}button.primary{background:var(--green);color:white;border-color:var(--green)}button:disabled{opacity:.5;cursor:wait}.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:18px;padding-bottom:110px}.card[hidden]{display:none}.card{content-visibility:auto;contain-intrinsic-size:300px;background:white;border-radius:13px;overflow:hidden;border:2px solid transparent;box-shadow:0 3px 20px #1c302408}.card.selected{border-color:var(--green)}.preview{position:relative;display:block;width:100%;padding:0;border:0;border-radius:0;background:#e4e7df;aspect-ratio:4/5}.preview img{width:100%;height:100%;object-fit:contain}.badge{position:absolute;bottom:10px;left:10px;background:#123c;backdrop-filter:blur(8px);color:white;border-radius:6px;padding:3px 9px}.card label{display:flex;gap:8px;padding:12px;cursor:pointer;align-items:center}.card label span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}input[type=checkbox]{width:20px;height:20px;accent-color:var(--green);flex-shrink:0}footer{position:fixed;bottom:0;left:0;right:0;background:#fffffff2;backdrop-filter:blur(12px);border-top:1px solid #ddd;padding:16px max(20px,calc((100vw - 1224px)/2));padding-bottom:max(16px,env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;gap:12px}#message{min-height:28px;margin:14px 0;color:#476458}#delivery{display:none;margin-bottom:18px;padding:18px;border-radius:12px;background:#e1ede4}dialog{border:0;border-radius:16px;background:#101b19;color:white;width:min(1100px,95vw);max-height:95vh;padding:15px}dialog::backdrop{background:#071410da}dialog img,dialog video{display:block;margin:12px auto;max-width:100%;max-height:70vh}dialog .tools{justify-content:space-between}#empty{padding:40px;text-align:center}@media(max-width:600px){header,main{padding:18px}header{padding-top:26px}h1{font-size:27px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card label{padding:8px;font-size:12px}.tools button{padding:8px 12px}footer{font-size:13px}footer button{padding:10px 12px}}
</style></head><body>
<header><small>PHOTO SELECTION / 摄影选片</small><h1 id="title">正在打开相册…</h1><div id="subtitle">预览不会下载原片，勾选后提交给摄影师。</div></header>
<main><div class="tools"><button id="all">全选</button><button id="clear">取消全部</button><button id="filter">只看已选</button><span id="total"></span></div><div id="message" role="status" aria-live="polite"></div><section id="delivery"></section><div id="empty" hidden>暂无素材，请联系摄影师。</div><section class="grid" id="grid"></section></main>
<footer><strong id="count">已选 0 项</strong><button class="primary" id="submit" disabled>确认提交选片</button></footer>
<dialog id="viewer"><div class="tools"><span id="viewName"></span><button id="close">关闭 ✕</button></div><div id="viewBody"></div><div class="tools"><button id="prev">← 上一项</button><button id="pick">选中此项</button><button id="next">下一项 →</button></div></dialog>
<script>
const $=id=>document.getElementById(id);
const base=location.pathname.replace(/\/?$/, '/');
const key='photo-picks:'+base;
let items=[],selected=new Set(),onlySelected=false,index=0,latest=null,pending=null,busy=false;
const cards=new Map(),byId=new Map();let saveTimer=null;let imageQueue=[],activeImages=0;
const observer=new IntersectionObserver(entries=>{for(const e of entries){if(e.isIntersecting){observer.unobserve(e.target);imageQueue.push(e.target)}}pumpImages()},{rootMargin:'180px'});
function pumpImages(){while(activeImages<4&&imageQueue.length){const img=imageQueue.shift();if(!img.isConnected)continue;activeImages++;const finish=()=>{activeImages--;pumpImages()};img.onload=finish;img.onerror=()=>{img.alt='预览加载失败，点击查看';finish()};img.src=img.dataset.src}}
function mediaUrl(item,type){return base+'media/'+item.id+'/'+type+'?v='+encodeURIComponent(item.revision||'p2')}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(save,180)}
function readLocal(){try{return JSON.parse(localStorage.getItem(key))}catch{return null}}
function save(){try{localStorage.setItem(key,JSON.stringify({ids:[...selected],pending}))}catch{}}
function message(text){$('message').textContent=text}
async function request(path,options){const r=await fetch(base+path,{cache:'no-store',...options});let data;try{data=await r.json()}catch{throw Error('连接中断，请稍后重试')}if(!r.ok)throw Error(data.error||'连接失败');return data}
function update(){let photos=0,videos=0;for(const id of selected){if(byId.get(id)?.kind==='video')videos++;else photos++}$('count').textContent=`已选 ${photos} 张照片 · ${videos} 段视频`;$('submit').disabled=busy||!selected.size;scheduleSave()}
function syncCard(id){const card=cards.get(id);if(!card)return;const picked=selected.has(id);card.classList.toggle('selected',picked);card.querySelector('input').checked=picked;card.hidden=onlySelected&&!picked}
function toggle(id){if(selected.has(id))selected.delete(id);else selected.add(id);pending=null;syncCard(id);update()}
function render(){const grid=$('grid');observer.disconnect();imageQueue=[];grid.replaceChildren();cards.clear();const fragment=document.createDocumentFragment();for(const item of items){const card=document.createElement('article');card.className='card';const preview=document.createElement('button');preview.className='preview';preview.setAttribute('aria-label','预览 '+item.name);const img=document.createElement('img');img.dataset.src=mediaUrl(item,'thumb');img.decoding='async';img.alt=item.name;preview.append(img);if(item.kind==='video'){const badge=document.createElement('span');badge.className='badge';badge.textContent='▶ 视频';preview.append(badge)}preview.onclick=()=>openViewer(byId.get(item.id).index);const label=document.createElement('label'),checkbox=document.createElement('input'),name=document.createElement('span');checkbox.type='checkbox';checkbox.onchange=()=>toggle(item.id);name.textContent=item.name;label.append(checkbox,name);card.append(preview,label);cards.set(item.id,card);fragment.append(card)}grid.append(fragment);for(const item of items){syncCard(item.id);observer.observe(cards.get(item.id).querySelector('img'))}update()}
function syncAll(){for(const item of items)syncCard(item.id);update();$('filter').textContent=onlySelected?'显示全部':'只看已选'}
function openViewer(n){index=(n+items.length)%items.length;const item=items[index];$('viewName').textContent=item.name;const body=$('viewBody');const old=body.querySelector('video');if(old)old.pause();body.replaceChildren();const media=document.createElement(item.kind==='video'?'video':'img');media.src=mediaUrl(item,item.kind==='video'?'video':'view');if(item.kind==='video'){media.controls=true;media.playsInline=true;media.preload='none';media.poster=mediaUrl(item,'thumb')}else media.alt=item.name;media.onerror=()=>message('预览加载失败，请稍后重试或联系摄影师。');body.append(media);$('pick').textContent=selected.has(item.id)?'取消选择':'选中此项';if(!$('viewer').open)$('viewer').showModal()}
$('close').onclick=()=>$('viewer').close();$('viewer').addEventListener('close',()=>{const video=$('viewBody').querySelector('video');if(video)video.pause();$('viewBody').replaceChildren()});$('prev').onclick=()=>openViewer(index-1);$('next').onclick=()=>openViewer(index+1);$('pick').onclick=()=>{toggle(items[index].id);$('pick').textContent=selected.has(items[index].id)?'取消选择':'选中此项'};
$('all').onclick=()=>{selected=new Set(items.map(i=>i.id));pending=null;syncAll()};$('clear').onclick=()=>{selected.clear();pending=null;syncAll()};$('filter').onclick=()=>{onlySelected=!onlySelected;syncAll()};
function delivery(s){latest=s;const box=$('delivery');box.replaceChildren();if(!s){box.style.display='none';return}box.style.display='block';const text=document.createElement('div');text.textContent=`选片已提交：${s.created} · ${s.items.length} 项。摄影师已收到，你可以继续调整后重新提交。`;box.append(text)}
$('submit').onclick=async()=>{if(busy||!selected.size)return;busy=true;update();message('正在提交，请稍候…');if(!pending){const bytes=new Uint8Array(16);crypto.getRandomValues(bytes);pending=[...bytes].map(b=>b.toString(16).padStart(2,'0')).join('');save()}try{const s=await request('submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids:[...selected],requestId:pending})});delivery(s);message('提交成功！摄影师电脑已保存选片结果。');pending=null;save()}catch(e){message(e.message+'。选择已在本机保留，可以重试。')}finally{busy=false;update()}};
async function init(){try{const data=await request('state');items=data.items;items.forEach((item,index)=>byId.set(item.id,{...item,index}));$('title').textContent=data.title;$('subtitle').textContent=data.name+' 的专属选片相册 · 勾选后点击确认提交';$('total').textContent=`共 ${items.length} 项`;$('empty').hidden=!!items.length;const local=readLocal();selected=new Set((local?local.ids:(data.latest?data.latest.items:[])).filter(id=>items.some(i=>i.id===id)));pending=local?.pending||null;render();delivery(data.latest);message('选择会自动保留在此浏览器；提交后才会发送给摄影师。')}catch(e){$('title').textContent='暂时无法打开相册';message(e.message+'。请确认摄影师电脑在线，或稍后刷新重试。')}}
window.addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});init();
</script></body></html>
